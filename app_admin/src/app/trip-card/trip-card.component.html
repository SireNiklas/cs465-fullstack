<div class="col">
  <div class="card h-100 shadow-sm">
    <img [src]="'http://localhost:3000/' + trip.image" class="card-img-top" [alt]="trip.name" style="height:180px;object-fit:cover">
    <div class="card-body">
      <h5 class="card-title">{{ trip.name }}</h5>
      <p class="card-text text-muted small">{{ trip.resort }} &bull; {{ trip.length }}</p>
      <p class="card-text" [innerHTML]="trip.description | slice:0:200"></p>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
      <span class="fw-bold">${{ trip.perPerson }}<small>/person</small></span>
      <div>
        <button class="btn btn-sm btn-outline-secondary me-1" (click)="editTrip(trip)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteTrip(trip.code)">Delete</button>
      </div>
    </div>
  </div>
</div>
