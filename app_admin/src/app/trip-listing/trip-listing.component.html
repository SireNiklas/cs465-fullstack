<div class="container">
  <div class="row mb-3">
    <div class="col"><h2>{{ config.heading }}</h2></div>
    <div class="col text-end">
      <a routerLink="/add-trip" class="btn btn-primary">Add Trip</a>
    </div>
  </div>

  <p *ngIf="message" class="alert alert-danger">{{ message }}</p>

  <app-browse-list
    [items]="items"
    [config]="config"
    (action)="onAction($event)">
  </app-browse-list>
</div>
