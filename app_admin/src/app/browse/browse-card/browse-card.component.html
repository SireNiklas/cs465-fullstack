<div class="card h-100">
  <img *ngIf="item.image" [src]="item.image" class="card-img-top" [alt]="item.title" />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ item.title }}</h5>
    <h6 *ngIf="item.subtitle" class="card-subtitle mb-2 text-muted">{{ item.subtitle }}</h6>
    <p *ngIf="item.description" class="card-text">{{ item.description }}</p>
    <div *ngIf="item.tags?.length" class="mb-2">
      <span *ngFor="let tag of item.tags" class="badge bg-secondary me-1">{{ tag }}</span>
    </div>
    <div class="mt-auto d-flex gap-2">
      <button *ngIf="config.primaryActionLabel"
              type="button" class="btn btn-sm btn-primary"
              (click)="emit('primary')">{{ config.primaryActionLabel }}</button>
      <button *ngIf="config.secondaryActionLabel"
              type="button" class="btn btn-sm btn-danger"
              (click)="emit('secondary')">{{ config.secondaryActionLabel }}</button>
    </div>
  </div>
</div>
